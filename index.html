<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#eef2f1;--surface:#fff;--ink:#14211f;--muted:#5d6f6b;--line:#d8e1df;--accent:#0b6e5f;--on-accent:#fff;--danger:#b42318;--warn:#fff4d6;--warn-ink:#7a5200;--soft:#f4f7f6}
:root[data-theme=dark]{--bg:#0d1514;--surface:#142120;--ink:#e6efed;--muted:#93a8a3;--line:#243634;--accent:#4fd1b5;--on-accent:#04211b;--danger:#ff8f85;--warn:#3a2e0d;--warn-ink:#f5d37a;--soft:#192a28}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 80px}
h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h2{margin:0 0 14px;font-size:1.15rem;font-weight:700}
.sub{color:var(--muted);margin:2px 0 0}
nav{display:flex;gap:4px;overflow-x:auto;margin:18px 0;padding-bottom:2px;border-bottom:1px solid var(--line)}
nav a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a:hover{color:var(--ink)}
nav a[aria-current=page]{color:var(--accent);border-color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid .card{margin:0}
.stat{display:block;color:inherit;text-decoration:none}
.stat small{color:var(--muted);display:block}
.stat b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere}
.neg{color:var(--danger)}.pos{color:var(--accent)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.wide{grid-column:1/-1}
label{display:block;font-size:.82rem;font-weight:500;color:var(--muted)}
input,select{width:100%;margin-top:4px;padding:9px 10px;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{padding:10px 16px;font:inherit;font-weight:700;color:var(--on-accent);background:var(--accent);border:0;border-radius:8px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .past{opacity:.55}
.grow{flex:1;min-width:0}
.grow strong,.grow small{display:block;overflow:hidden;text-overflow:ellipsis}
.grow small{color:var(--muted)}
.tag{flex:none;min-width:2.2rem;text-align:center;padding:3px 10px;font-size:.78rem;font-weight:700;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.amt{font-weight:700;white-space:nowrap}
.icon{flex:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:6px 8px;border-radius:6px}
.icon:hover{color:var(--danger)}
.empty{color:var(--muted);margin:0}
.alert{background:var(--warn);color:var(--warn-ink);padding:12px 16px;border-radius:10px;margin-bottom:14px;font-weight:500}
.chart-box{position:relative;height:260px}
.bar{display:flex;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9}
#toast[hidden]{display:none}
#toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Money Manager</h1><p class="sub">Your expenses, plans and meals in one place. Data stays in this browser.</p></header>
  <nav id="nav" aria-label="Sections"></nav>
  <main id="view"></main>
</div>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR" });
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const fmtDate = d => new Date(d + "T00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random());
const sum = (arr, type) => arr.filter(t => t.type === type).reduce((a, t) => a + (+t.amount || 0), 0);

/* ---------- storage (same keys as the previous version, so old data still loads) ---------- */
const U = "local_user", COLS = ["accounts", "transactions", "events", "vacations", "holidays", "meals"];
const S = {};
const read = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast("Could not save: browser storage is full or blocked."); } };
const load = () => {
  COLS.forEach(c => { const v = read(`${c}_${U}`, []); S[c] = Array.isArray(v) ? v : []; });
  S.username = read(`username_${U}`, "") || "";
  S.threshold = +read(`lowBalanceThreshold_${U}`, 0) || 0;
};
const save = () => {
  COLS.forEach(c => write(`${c}_${U}`, S[c]));
  write(`username_${U}`, S.username);
  write(`lowBalanceThreshold_${U}`, S.threshold);
};

/* ---------- theme ---------- */
const mq = matchMedia("(prefers-color-scheme: dark)");
const applyTheme = () => {
  const pref = read("theme", "system");
  document.documentElement.dataset.theme = pref === "system" ? (mq.matches ? "dark" : "light") : pref;
};
mq.addEventListener("change", () => { applyTheme(); render(); });

/* ---------- toast with undo ---------- */
let toastTimer, undoFn;
function toast(msg, undo) {
  const el = $("#toast"); undoFn = undo;
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" data-undo>Undo</button>' : ""}`;
  el.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), 6000);
}

/* ---------- config for the simple list sections ---------- */
const upcomingFirst = key => (a, b) => {
  const t = today(), pa = a[key] < t, pb = b[key] < t;
  return pa !== pb ? pa - pb : pa ? b[key].localeCompare(a[key]) : a[key].localeCompare(b[key]);
};
const LISTS = {
  events: {
    col: "events", title: "Events", add: "Add an event", cta: "Save event", empty: "No events yet. Add a birthday, appointment or reminder above.",
    sort: upcomingFirst("date"), past: e => e.date < today(),
    fields: [
      { n: "title", l: "Title", req: 1, ph: "Asha’s birthday" },
      { n: "date", l: "Date", t: "date", req: 1 },
      { n: "type", l: "Type", t: "select", o: ["Birthday", "Appointment", "Holiday", "Reminder"] },
      { n: "description", l: "Notes (optional)", wide: 1 }],
    row: e => ({ tag: e.type, title: e.title, sub: fmtDate(e.date) + (e.description ? " – " + e.description : "") })
  },
  vacation: {
    col: "vacations", title: "Trips", add: "Plan a trip", cta: "Save trip", empty: "No trips planned. Add a destination and dates above.",
    sort: upcomingFirst("start_date"), past: v => v.end_date < today(),
    fields: [
      { n: "name", l: "Destination", req: 1, ph: "Hampi" },
      { n: "start_date", l: "Start", t: "date", req: 1 },
      { n: "end_date", l: "End", t: "date", req: 1 },
      { n: "participants", l: "Who’s going (comma separated)", wide: 1, ph: "Alice, Bob" }],
    check: d => d.end_date < d.start_date && "End date must be on or after the start date.",
    row: v => {
      const days = Math.round((new Date(v.end_date) - new Date(v.start_date)) / 864e5) + 1;
      return { tag: days + (days === 1 ? " day" : " days"), title: v.name, sub: `${fmtDate(v.start_date)} to ${fmtDate(v.end_date)}${v.participants ? " – " + v.participants : ""}` };
    }
  },
  holiday: {
    col: "holidays", title: "Holidays", add: "Add a day off", cta: "Save holiday", empty: "No holidays saved yet.",
    sort: upcomingFirst("date"), past: h => h.date < today(),
    fields: [{ n: "name", l: "Name", req: 1, ph: "Diwali" }, { n: "date", l: "Date", t: "date", req: 1 }],
    row: h => ({ tag: "Off", title: h.name, sub: fmtDate(h.date) })
  },
  diet: {
    col: "meals", title: "Meals", add: "Log a meal", cta: "Log meal", empty: "No meals logged yet.",
    sort: (a, b) => b.date.localeCompare(a.date) || b.timestamp.localeCompare(a.timestamp),
    fields: [
      { n: "name", l: "Meal", req: 1, ph: "Chicken salad" },
      { n: "date", l: "Date", t: "date", req: 1, def: today },
      { n: "calories", l: "Calories (kcal)", t: "number", req: 1, min: 0, ph: "450" },
      { n: "ingredients", l: "Ingredients or notes (optional)", wide: 1 }],
    row: m => ({ tag: m.calories + " kcal", title: m.name, sub: fmtDate(m.date) + (m.ingredients ? " – " + m.ingredients : "") })
  }
};
const field = f => {
  const id = "f-" + f.n, cls = f.wide ? ' class="wide"' : "";
  const ctl = f.t === "select"
    ? `<select id="${id}" name="${f.n}">${f.o.map(o => `<option>${esc(o)}</option>`).join("")}</select>`
    : `<input id="${id}" name="${f.n}" type="${f.t || "text"}" ${f.req ? "required" : ""} ${f.min != null ? `min="${f.min}"` : ""} ${f.t === "number" ? 'step="1" inputmode="numeric"' : ""} placeholder="${esc(f.ph || "")}" value="${esc(f.def ? f.def() : "")}">`;
  return `<div${cls}><label for="${id}">${f.l}</label>${ctl}</div>`;
};
function listView(key) {
  const L = LISTS[key], items = [...S[L.col]].sort(L.sort);
  const li = it => {
    const r = L.row(it);
    return `<li class="${L.past && L.past(it) ? "past" : ""}"><span class="tag">${esc(r.tag)}</span>
      <div class="grow"><strong>${esc(r.title)}</strong><small>${esc(r.sub)}</small></div>
      <button class="icon" data-del="${L.col}:${it.id}" aria-label="Delete ${esc(r.title)}">✕</button></li>`;
  };
  return `<section class="card"><h2>${L.add}</h2>
    <form class="row" data-form="${key}">${L.fields.map(field).join("")}<button class="btn">${L.cta}</button></form></section>
    <section class="card"><h2>${L.title}</h2>${items.length ? `<ul class="list">${items.map(li).join("")}</ul>` : `<p class="empty">${L.empty}</p>`}</section>`;
}

/* ---------- views ---------- */
const TIPS = [
  "Look at your last five expenses and pick one to cut next month.",
  "Try 50/30/20: needs, wants, savings.",
  "Cook at home this week instead of ordering in.",
  "Move money to savings the day your salary arrives.",
  "Pick one no-spend day this week.",
  "Cancel a subscription you haven’t used this month."
];
let acc = "all", charts = [];

function home() {
  const t = today(), hr = new Date().getHours();
  const hi = hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";
  const bal = sum(S.transactions, "income") - sum(S.transactions, "expense");
  const ev = S.events.filter(e => e.date >= t).sort((a, b) => a.date.localeCompare(b.date))[0];
  const trip = S.vacations.filter(v => v.end_date >= t).sort((a, b) => a.start_date.localeCompare(b.start_date))[0];
  const kcal = S.meals.filter(m => m.date === t).reduce((a, m) => a + (+m.calories || 0), 0);
  const stat = (href, label, val, cls = "") => `<a class="card stat" href="#${href}"><small>${label}</small><b class="${cls}">${val}</b></a>`;
  return `<section class="card"><h2>${hi}, ${esc(S.username || "there")}</h2><p class="sub">${esc(TIPS[new Date().getDate() % TIPS.length])}</p></section>
    <div class="grid g3">
      ${stat("money", "Balance, all accounts", inr.format(bal), bal < 0 ? "neg" : "pos")}
      ${stat("events", "Next event", ev ? esc(ev.title) + "<small>" + fmtDate(ev.date) + "</small>" : "None")}
      ${stat("vacation", "Next trip", trip ? esc(trip.name) + "<small>" + fmtDate(trip.start_date) + "</small>" : "None")}
      ${stat("diet", "Calories today", kcal + " kcal")}
    </div>`;
}

function money() {
  const tx = S.transactions.filter(t => acc === "all" || t.accountId === acc).sort((a, b) => b.timestamp.localeCompare(a.timestamp));
  const inc = sum(tx, "income"), exp = sum(tx, "expense"), bal = inc - exp;
  const opts = S.accounts.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("");
  const accName = id => (S.accounts.find(a => a.id === id) || {}).name || "Unlinked account";
  const warn = S.threshold > 0 && bal < S.threshold
    ? `<div class="alert" role="alert">Balance ${inr.format(bal)} is below your ${inr.format(S.threshold)} warning level.</div>` : "";
  const rows = tx.map(t => {
    const x = t.type === "expense";
    return `<li><span class="tag">${esc((t.category || "?")[0].toUpperCase())}</span>
      <div class="grow"><strong>${esc(t.description)}</strong><small>${esc(t.category)} – ${esc(accName(t.accountId))} – ${new Date(t.timestamp).toLocaleDateString("en-IN", { day: "numeric", month: "short" })}</small></div>
      <span class="amt ${x ? "neg" : "pos"}">${x ? "−" : "+"}${inr.format(t.amount)}</span>
      <button class="icon" data-del="transactions:${t.id}" aria-label="Delete ${esc(t.description)}">✕</button></li>`;
  }).join("");
  return `<section class="card"><label for="acc-filter">Showing</label>
      <select id="acc-filter"><option value="all">All accounts</option>${opts}</select></section>
    ${warn}
    <div class="grid g3">
      <div class="card stat"><small>Balance</small><b class="${bal < 0 ? "neg" : "pos"}">${inr.format(bal)}</b></div>
      <div class="card stat"><small>Income</small><b>${inr.format(inc)}</b></div>
      <div class="card stat"><small>Expenses</small><b>${inr.format(exp)}</b></div>
    </div>
    <div class="grid g2">
      <section class="card"><h2>Accounts</h2>
        <form class="bar" data-form="account"><input name="name" required placeholder="Savings, Credit card…" aria-label="Account name" style="flex:1;margin:0"><button class="btn">Add account</button></form>
        <ul class="list">${S.accounts.map(a => `<li><div class="grow"><strong>${esc(a.name)}</strong></div><button class="icon" data-del="accounts:${a.id}" aria-label="Delete ${esc(a.name)}">✕</button></li>`).join("")}</ul>
        ${S.accounts.length ? "" : '<p class="empty">Add an account to start recording transactions.</p>'}</section>
      <section class="card"><h2>Low balance warning</h2>
        <label for="threshold">Warn me when the balance drops below (₹)</label>
        <input id="threshold" type="number" min="0" step="1" value="${S.threshold || ""}" placeholder="0 turns it off"></section>
    </div>
    <section class="card"><h2>Add a transaction</h2>
      <form class="row" data-form="tx">
        <div><label for="t-acc">Account</label><select id="t-acc" name="accountId" required>${opts || '<option value="">Add an account first</option>'}</select></div>
        <div><label for="t-type">Type</label><select id="t-type" name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div>
        <div><label for="t-amt">Amount (₹)</label><input id="t-amt" name="amount" type="number" min="0.01" step="0.01" required placeholder="250"></div>
        <div><label for="t-cat">Category</label><input id="t-cat" name="category" required placeholder="Groceries" list="cats"></div>
        <div class="wide"><label for="t-desc">Description</label><input id="t-desc" name="description" required placeholder="Weekly vegetables"></div>
        <button class="btn" ${S.accounts.length ? "" : "disabled"}>Add transaction</button>
      </form>
      <datalist id="cats">${[...new Set(S.transactions.map(t => t.category))].map(c => `<option value="${esc(c)}">`).join("")}</datalist></section>
    ${exp ? `<div class="grid g2"><section class="card"><h2>Spending by category</h2><div class="chart-box"><canvas id="pie" role="img" aria-label="Spending by category"></canvas></div></section>
      <section class="card"><h2>Top categories</h2><div class="chart-box"><canvas id="bar" role="img" aria-label="Top spending categories"></canvas></div></section></div>` : ""}
    <section class="card"><h2>Transactions</h2>${tx.length ? `<ul class="list">${rows}</ul>` : '<p class="empty">No transactions yet.</p>'}</section>`;
}

function drawCharts() {
  charts.forEach(c => c.destroy()); charts = [];
  const pie = $("#pie"), bar = $("#bar");
  if (!pie || !window.Chart) return;
  const map = {};
  S.transactions.filter(t => t.type === "expense" && (acc === "all" || t.accountId === acc))
    .forEach(t => { const k = (t.category || "Other").trim(); map[k] = (map[k] || 0) + (+t.amount || 0); });
  const e = Object.entries(map).sort((a, b) => b[1] - a[1]);
  const labels = e.map(x => x[0]), data = e.map(x => x[1]);
  const pal = ["#0b6e5f", "#e0a100", "#3a6ea5", "#c4522d", "#7a5ca8", "#4aa36c", "#b5477a", "#6b7b78"];
  const colors = labels.map((_, i) => pal[i % pal.length]);
  const ink = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
  const line = getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
  const tip = { callbacks: { label: c => `${c.label}: ${inr.format(c.raw)}` } };
  charts.push(new Chart(pie, { type: "doughnut", data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: "transparent" }] },
    options: { maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { color: ink } }, tooltip: tip } } }));
  charts.push(new Chart(bar, { type: "bar", data: { labels: labels.slice(0, 5), datasets: [{ data: data.slice(0, 5), backgroundColor: colors, borderRadius: 4 }] },
    options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: tip },
      scales: { x: { ticks: { color: ink, callback: v => "₹" + v }, grid: { color: line } }, y: { ticks: { color: ink }, grid: { display: false } } } } }));
}

function settings() {
  const th = read("theme", "system");
  return `<section class="card"><h2>Profile</h2>
      <form class="bar" data-form="profile"><input name="username" value="${esc(S.username)}" placeholder="Your name" aria-label="Display name" style="flex:1;margin:0"><button class="btn">Save name</button></form></section>
    <section class="card"><h2>Appearance</h2><label for="theme">Theme</label>
      <select id="theme">${["system", "light", "dark"].map(o => `<option ${o === th ? "selected" : ""}>${o}</option>`).join("")}</select></section>
    <section class="card"><h2>Your data</h2><p class="sub" style="margin-bottom:12px">Everything lives in this browser. Export a backup before clearing browser data or switching devices.</p>
      <div class="bar"><button class="btn" data-act="export">Export backup</button>
      <button class="btn ghost" data-act="import">Import backup</button>
      <button class="btn danger" data-act="reset">Delete all data</button></div>
      <input id="file" type="file" accept="application/json" hidden></section>`;
}

/* ---------- router ---------- */
const VIEWS = { home, money, settings, events: () => listView("events"), vacation: () => listView("vacation"), holiday: () => listView("holiday"), diet: () => listView("diet") };
const NAV = [["home", "Home"], ["money", "Money"], ["events", "Events"], ["vacation", "Trips"], ["holiday", "Holidays"], ["diet", "Meals"], ["settings", "Settings"]];
function render() {
  const v = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "home";
  $("#nav").innerHTML = NAV.map(([k, l]) => `<a href="#${k}" ${k === v ? 'aria-current="page"' : ""}>${l}</a>`).join("");
  $("#view").innerHTML = VIEWS[v]();
  if (v === "money") { $("#acc-filter").value = S.accounts.some(a => a.id === acc) ? acc : (acc = "all"); drawCharts(); }
}

/* ---------- actions ---------- */
function add(col, data) { S[col].push({ id: uid(), timestamp: new Date().toISOString(), ...data }); save(); render(); }
function del(col, id) {
  const i = S[col].findIndex(x => x.id === id); if (i < 0) return;
  if (col === "accounts" && !confirm("Delete this account? Its transactions stay but become unlinked.")) return;
  const [item] = S[col].splice(i, 1); save(); render();
  toast("Deleted.", () => { S[col].splice(Math.min(i, S[col].length), 0, item); save(); render(); });
}
document.addEventListener("submit", e => {
  const f = e.target, k = f.dataset.form; if (!k) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f)); for (const x in d) d[x] = d[x].trim();
  if (k === "account") return add("accounts", { name: d.name });
  if (k === "profile") { S.username = d.username; save(); render(); return toast("Name saved."); }
  if (k === "tx") return add("transactions", { ...d, amount: parseFloat(d.amount) });
  const L = LISTS[k], err = L.check && L.check(d);
  if (err) return toast(err);
  if (k === "diet") d.calories = parseInt(d.calories, 10);
  add(L.col, d);
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-del],[data-undo],[data-act]"); if (!t) return;
  if (t.dataset.del) { const [c, id] = t.dataset.del.split(":"); return del(c, id); }
  if (t.dataset.undo) { undoFn && undoFn(); undoFn = null; $("#toast").hidden = true; return; }
  const a = t.dataset.act;
  if (a === "export") {
    const out = Object.fromEntries([...COLS, "username", "threshold"].map(k => [k, S[k]]));
    const link = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" })), download: `money-manager-${today()}.json` });
    link.click(); URL.revokeObjectURL(link.href);
  }
  if (a === "import") $("#file").click();
  if (a === "reset" && confirm("Delete all accounts, transactions, events, trips, holidays and meals? This cannot be undone.")) {
    COLS.forEach(c => (S[c] = [])); S.username = ""; S.threshold = 0; save(); render(); toast("All data deleted.");
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "acc-filter") { acc = t.value; render(); }
  else if (t.id === "threshold") { S.threshold = Math.max(0, parseFloat(t.value) || 0); save(); render(); }
  else if (t.id === "theme") { write("theme", t.value); applyTheme(); render(); }
  else if (t.id === "file" && t.files[0]) {
    t.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      COLS.forEach(c => { if (Array.isArray(d[c])) S[c] = d[c]; });
      if (typeof d.username === "string") S.username = d.username;
      if (!isNaN(+d.threshold)) S.threshold = +d.threshold;
      save(); render(); toast("Backup imported.");
    }).catch(() => toast("That file is not a valid backup."));
  }
});
window.addEventListener("hashchange", () => { render(); scrollTo(0, 0); });

load(); applyTheme(); render();
</script>
</body>
</html>
